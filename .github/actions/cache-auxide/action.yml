name: Cache pinned Auxide build
description: Restore, realise, and retain the Auxide package pinned by flake.lock

runs:
  using: composite
  steps:
    - name: Identify the exact Auxide derivation
      id: cache-key
      shell: bash
      run: |
        auxide_derivation="$(
          nix eval --raw \
            .#nixosConfigurations.homeserver.config.services.auxide.package.drvPath
        )"
        auxide_derivation_hash="$(
          printf '%s' "${auxide_derivation}" | sha256sum | awk '{print $1}'
        )"
        nix_version="$(nix --version | awk '{print $NF}')"
        echo "Auxide derivation: ${auxide_derivation}"
        echo "auxide-derivation-hash=${auxide_derivation_hash}" >> "${GITHUB_OUTPUT}"
        echo "nix-version=${nix_version}" >> "${GITHUB_OUTPUT}"

    # Key on the resulting derivation rather than only Auxide's source commit:
    # a transitive input or package override can change the build without
    # changing that commit. PR caches cannot feed main, so PRs only read; a
    # main workflow seeds each new Auxide derivation.
    - name: Restore the pinned Auxide build
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: >-
          nix-auxide-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.nix-version }}-${{ steps.cache-key.outputs.auxide-derivation-hash }}
        save: ${{ github.event_name != 'pull_request' }}
        # Auxide's runtime closure is currently about 812 MiB. Retaining it
        # while capping the complete saved store at 2 GiB leaves ample room
        # for the Nix installation and several cache generations.
        gc-max-store-size-linux: 2G

    - name: Realise and retain the pinned Auxide package
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/nix-cache-roots"
        nix build \
          --out-link "${RUNNER_TEMP}/nix-cache-roots/auxide" \
          .#nixosConfigurations.homeserver.config.services.auxide.package

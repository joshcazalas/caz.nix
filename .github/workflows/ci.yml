name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from the build so a formatting or ShellCheck mistake is reported in
  # well under a minute instead of behind a four-minute closure build. These
  # two jobs share no work, so running them apart costs nothing.
  lint:
    name: Lint and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately no `nothing-but-nix` and no `build-dir` here. Both exist to
      # fit the server closure on a runner that cannot hold it; this job only
      # realises the small development shell.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check formatting, source, and workflows
        run: nix develop --command ./scripts/check.sh

      - name: Scan the complete Git history for secrets
        run: nix develop --command ./scripts/secret-scan.sh

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Identify the pinned Auxide build
        id: auxide-cache
        run: |
          auxide_revision="$(
            jq -er '.nodes.auxide.locked.rev | select(test("^[0-9a-f]{40}$"))' flake.lock
          )"
          nix_version="$(nix --version | awk '{print $NF}')"
          echo "auxide-revision=${auxide_revision}" >> "${GITHUB_OUTPUT}"
          echo "nix-version=${nix_version}" >> "${GITHUB_OUTPUT}"

      # The lock already fixes Auxide to an immutable commit. Keep its realised
      # Nix output in GitHub's repository-local cache so ordinary caz.nix
      # changes do not recompile the same Rust program. PR caches cannot feed
      # main, so PRs only read; a main workflow seeds each new Auxide revision.
      - name: Restore the pinned Auxide build
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: >-
            nix-auxide-v1-${{ runner.os }}-${{ steps.auxide-cache.outputs.nix-version }}-${{ steps.auxide-cache.outputs.auxide-revision }}
          save: ${{ github.event_name != 'pull_request' }}
          # Auxide's runtime closure is currently about 812 MiB. Retaining it
          # while capping the complete saved store at 2 GiB leaves ample room
          # for the Nix installation and several cache generations.
          gc-max-store-size-linux: 2G

      - name: Realise and retain the pinned Auxide package
        run: |
          mkdir -p "${RUNNER_TEMP}/nix-cache-roots"
          nix build \
            --out-link "${RUNNER_TEMP}/nix-cache-roots/auxide" \
            .#nixosConfigurations.homeserver.config.services.auxide.package

      - name: Evaluate and build every declared output
        run: nix flake check --print-build-logs

  # `Validate` is the required status check on `main`. Keeping that exact name
  # on a job that passes only when both real jobs passed means the split needs
  # no branch-protection change, and a lint failure still blocks a merge just as
  # it did when everything lived in one job. Renaming this would silently leave
  # `main` waiting for a context that no longer reports.
  validate:
    name: Validate
    needs:
      - lint
      - build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every check to have succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "lint=${LINT_RESULT} build=${BUILD_RESULT}"
          [[ "${LINT_RESULT}" == success && "${BUILD_RESULT}" == success ]]

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from the build so a formatting or ShellCheck mistake is reported in
  # well under a minute instead of behind a four-minute closure build. These
  # two jobs share no work, so running them apart costs nothing.
  lint:
    name: Lint and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately no `nothing-but-nix` and no `build-dir` here. Both exist to
      # fit the server closure on a runner that cannot hold it; this job only
      # realises the small development shell.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check formatting, source, and workflows
        run: nix develop --command ./scripts/check.sh

      - name: Scan the complete Git history for secrets
        run: nix develop --command ./scripts/secret-scan.sh

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      # A composite action keeps the cache restore and this build on the same
      # runner while sharing the policy with the release workflow.
      - name: Cache the pinned Auxide build
        uses: ./.github/actions/cache-auxide

      - name: Evaluate and build every declared output
        run: nix flake check --print-build-logs

  windows:
    name: Validate Windows configuration
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse PowerShell, JSON, capabilities, and profiles
        shell: powershell
        run: .\scripts\check-windows.ps1

      - name: Parse and resolve with WinGet
        shell: powershell
        run: |
          $winGetCommand = (Get-Command winget.exe -CommandType Application -ErrorAction Stop).Source
          Get-ChildItem .\windows\capabilities\*.winget | ForEach-Object {
            Write-Host "Parsing and resolving $($_.Name) with WinGet"
            $succeeded = $false
            foreach ($attempt in 1, 2) {
              & $winGetCommand configure show --file $_.FullName
              if ($LASTEXITCODE -eq 0) {
                $succeeded = $true
                break
              }
              if ($attempt -eq 1) {
                Write-Warning "WinGet initialization failed; retrying once."
              }
            }
            if (-not $succeeded) {
              throw "WinGet could not parse and resolve $($_.Name) after two attempts."
            }
          }

  # `Validate` is the required status check on `main`. Keeping that exact name
  # on a job that passes only when both real jobs passed means the split needs
  # no branch-protection change, and a lint failure still blocks a merge just as
  # it did when everything lived in one job. Renaming this would silently leave
  # `main` waiting for a context that no longer reports.
  validate:
    name: Validate
    needs:
      - lint
      - build
      - windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every check to have succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          echo "lint=${LINT_RESULT} build=${BUILD_RESULT} windows=${WINDOWS_RESULT}"
          [[ "${LINT_RESULT}" == success && "${BUILD_RESULT}" == success && "${WINDOWS_RESULT}" == success ]]

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      homeserver: ${{ steps.classify.outputs.homeserver }}
      wsl: ${{ steps.classify.outputs.wsl }}
      integration: ${{ steps.classify.outputs.integration }}
      windows: ${{ steps.classify.outputs.windows }}

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected components
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            ./scripts/classify-ci-changes.sh --all >> "${GITHUB_OUTPUT}"
          else
            git diff --no-renames --name-only --diff-filter=ACDMRTUXB -z "${BASE_SHA}" "${MERGE_SHA}" \
              | ./scripts/classify-ci-changes.sh >> "${GITHUB_OUTPUT}"
          fi

  # Keep source diagnostics independent from the closure builds so formatting
  # and ShellCheck failures still arrive quickly. The no-build check validates
  # every flake output even when an unaffected component build is skipped.
  lint:
    name: Evaluate, lint, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately no `nothing-but-nix` and no `build-dir` here. Both exist to
      # fit the server closure on a runner that cannot hold it; this job only
      # realises the small development shell.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check formatting, source, and workflows
        run: nix develop --command ./scripts/check.sh

      - name: Scan the complete Git history for secrets
        run: nix develop --command ./scripts/secret-scan.sh

      - name: Evaluate every flake output
        run: nix flake check --no-build

      - name: Require every flake check to have a CI group
        run: ./scripts/build-ci-check-group.sh validate

  homeserver:
    name: Build homeserver
    needs: changes
    if: needs.changes.outputs.homeserver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      # Only the homeserver consumes Auxide. Keeping this restore out of the
      # WSL and integration jobs avoids about 45-55 seconds of irrelevant work.
      - name: Cache the pinned Auxide build
        uses: ./.github/actions/cache-auxide

      - name: Build the homeserver closure
        run: ./scripts/build-ci-check-group.sh homeserver

  wsl:
    name: Build WSL home
    needs: changes
    if: needs.changes.outputs.wsl == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Build the WSL activation and assertions
        run: ./scripts/build-ci-check-group.sh wsl

  integration:
    name: Run NixOS integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Build the integration checks
        run: ./scripts/build-ci-check-group.sh integration

  windows:
    name: Validate Windows configuration
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse PowerShell, JSON, capabilities, and profiles
        shell: powershell
        run: .\scripts\check-windows.ps1

      - name: Parse and resolve with WinGet
        shell: powershell
        run: |
          $winGetCommand = (Get-Command winget.exe -CommandType Application -ErrorAction Stop).Source
          Get-ChildItem .\windows\capabilities\*.winget | ForEach-Object {
            Write-Host "Parsing and resolving $($_.Name) with WinGet"
            $succeeded = $false
            foreach ($attempt in 1, 2) {
              & $winGetCommand configure show --file $_.FullName
              if ($LASTEXITCODE -eq 0) {
                $succeeded = $true
                break
              }
              if ($attempt -eq 1) {
                Write-Warning "WinGet initialization failed; retrying once."
              }
            }
            if (-not $succeeded) {
              throw "WinGet could not parse and resolve $($_.Name) after two attempts."
            }
          }

  # `Validate` is the required status check on `main`. It accepts a component
  # job only when it succeeded or the classifier deliberately skipped it.
  # Renaming this would silently leave `main` waiting for a context that no
  # longer reports.
  validate:
    name: Validate
    needs:
      - changes
      - lint
      - homeserver
      - wsl
      - integration
      - windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every check to have succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          HOMESERVER_SELECTED: ${{ needs.changes.outputs.homeserver }}
          HOMESERVER_RESULT: ${{ needs.homeserver.result }}
          WSL_SELECTED: ${{ needs.changes.outputs.wsl }}
          WSL_RESULT: ${{ needs.wsl.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          WINDOWS_SELECTED: ${{ needs.changes.outputs.windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          echo "changes=${CHANGES_RESULT} lint=${LINT_RESULT} homeserver=${HOMESERVER_RESULT} wsl=${WSL_RESULT} integration=${INTEGRATION_RESULT} windows=${WINDOWS_RESULT}"

          [[ "${CHANGES_RESULT}" == success && "${LINT_RESULT}" == success ]]

          require_component_result() {
            local name="$1"
            local selected="$2"
            local result="$3"

            if [[ "${selected}" == true ]]; then
              [[ "${result}" == success ]] || {
                echo "${name} was selected but finished as ${result}." >&2
                return 1
              }
            elif [[ "${selected}" == false ]]; then
              [[ "${result}" == skipped ]] || {
                echo "${name} was not selected but finished as ${result}." >&2
                return 1
              }
            else
              echo "${name} has invalid classifier output: ${selected@Q}." >&2
              return 1
            fi
          }

          require_component_result homeserver "${HOMESERVER_SELECTED}" "${HOMESERVER_RESULT}"
          require_component_result wsl "${WSL_SELECTED}" "${WSL_RESULT}"
          require_component_result integration "${INTEGRATION_SELECTED}" "${INTEGRATION_RESULT}"
          require_component_result windows "${WINDOWS_SELECTED}" "${WINDOWS_RESULT}"

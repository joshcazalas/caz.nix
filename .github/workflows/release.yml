name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve runner space for the Nix store
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: holster

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Identify the pinned Auxide build
        id: auxide-cache
        run: |
          auxide_revision="$(
            jq -er '.nodes.auxide.locked.rev | select(test("^[0-9a-f]{40}$"))' flake.lock
          )"
          nix_version="$(nix --version | awk '{print $NF}')"
          echo "auxide-revision=${auxide_revision}" >> "${GITHUB_OUTPUT}"
          echo "nix-version=${nix_version}" >> "${GITHUB_OUTPUT}"

      - name: Restore the pinned Auxide build
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: >-
            nix-auxide-v1-${{ runner.os }}-${{ steps.auxide-cache.outputs.nix-version }}-${{ steps.auxide-cache.outputs.auxide-revision }}
          gc-max-store-size-linux: 2G

      - name: Realise and retain the pinned Auxide package
        run: |
          mkdir -p "${RUNNER_TEMP}/nix-cache-roots"
          nix build \
            --out-link "${RUNNER_TEMP}/nix-cache-roots/auxide" \
            .#nixosConfigurations.homeserver.config.services.auxide.package

      # Linting and the full-history secret scan are deliberately not repeated
      # here. `main` requires the `Validate` check with strict mode enabled, so
      # a branch must be current with `main` before it can merge, and CI runs
      # against the merge result. The tree that lands is therefore the exact
      # tree that was linted and scanned. Administrators are included in that
      # rule and force pushes are blocked, so there is no path onto `main` that
      # skips it. Relaxing any of those settings means restoring these steps.
      - name: Evaluate and build every declared output
        run: nix flake check --print-build-logs

      - name: Choose the immutable release identity
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${COMMIT_SHA:0:12}"
          tag="caz.nix-$(date -u +%Y.%m.%d)-g${short_sha}"
          directory=".release/${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "directory=${directory}" >> "${GITHUB_OUTPUT}"

      - name: Build SBOMs and traceability artifacts
        env:
          RELEASE_DIRECTORY: ${{ steps.release.outputs.directory }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          nix develop .#release --command ./scripts/build-release-artifacts.sh
          "${RELEASE_TAG}" "${RELEASE_DIRECTORY}"

      # Artifact attestations are included on public repositories with GitHub
      # Free. The release still works while the repository remains private.
      - name: Attest the release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.directory }}/*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.release.outputs.directory }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/publish-release.sh "${RELEASE_TAG}" "${RELEASE_DIRECTORY}"

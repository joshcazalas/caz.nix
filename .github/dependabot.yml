version: 2

updates:
  # Keep application sources separate from the OS/toolchain and from Auxide.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
      time: "09:17"
      timezone: America/Chicago
    groups:
      auxide:
        patterns:
          - "auxide"
      ha-integrations:
        patterns:
          - "ha-lightfx-src"
          - "scene-presets-src"
      flake-inputs:
        patterns:
          - "*"
        exclude-patterns:
          - "auxide"
          - "ha-lightfx-src"
          - "scene-presets-src"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(nix)"

  - package-ecosystem: docker
    directories:
      - /containers/home-assistant
      - /containers/minecraft
    schedule:
      interval: daily
      time: "09:32"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(containers)"

  # Action updates work for both private and public repositories. Scan both the
  # workflows and the local composite action; `/` does not recursively discover
  # action manifests. Keep updates in a separate PR so changes to CI's trusted
  # code are especially easy to audit.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/cache-auxide
    schedule:
      interval: weekly
      day: monday
      time: "09:47"
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: npm
    directory: /packages/website-updater
    schedule:
      interval: weekly
      day: monday
      time: "10:17"
      timezone: America/Chicago
    groups:
      website-updater:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(website)"

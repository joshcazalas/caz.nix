version: 2

updates:
  # Both root-flake groups share this weekday schedule. Keep Auxide separate
  # so unrelated input updates cannot occupy its only available PR slot.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
      time: "09:17"
      timezone: America/Chicago
    groups:
      auxide:
        patterns:
          - "auxide"
      flake-inputs:
        patterns:
          - "*"
        exclude-patterns:
          - "auxide"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(nix)"

  # Action updates work for both private and public repositories. Scan both the
  # workflows and the local composite action; `/` does not recursively discover
  # action manifests. Keep updates in a separate PR so changes to CI's trusted
  # code are especially easy to audit.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/cache-auxide
    schedule:
      interval: weekly
      day: monday
      time: "09:47"
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(actions)"

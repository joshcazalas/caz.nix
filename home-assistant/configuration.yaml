---
# The release owns this entry point. Mutable integrations, credentials, and
# entity registries remain in /config/.storage and are never committed.
default_config:

homeassistant:
  # Declare the available MFA method. Each user must enroll from their profile;
  # enrollment and authenticator secrets remain private runtime state.
  auth_mfa_modules:
    - type: totp
  packages: !include_dir_named packages

# Preserve the Home Assistant UI editors for unrelated automations, scripts,
# and scenes. These files stay in the writable application-state directory.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
